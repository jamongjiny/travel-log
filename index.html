<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 기록장</title>
<meta name="theme-color" content="#F5F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --sub:#6B7280; --line:#E7E1D4; --soft:#EFEADF;
  --accent:#1D2433; --warn:#D9534F; --ok:#2F8F6B;
  --r:18px; --sh:0 1px 2px rgba(29,36,51,.05),0 6px 20px rgba(29,36,51,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}

/* 상단 */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0;flex:1}
.ibtn{width:40px;height:40px;border-radius:13px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px;flex:none}
.ibtn.dark{background:var(--ink);color:#fff}
.sync{font-size:11px;color:var(--sub);text-align:right;margin:-10px 2px 10px;min-height:16px;pointer-events:none}
.sync.off{color:var(--warn)}

/* 탭·칩 */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:14px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.55);margin:0 4px 4px 0}
.group-h{font-size:13px;font-weight:700;color:var(--sub);margin:20px 4px 8px;display:flex;justify-content:space-between}

/* 여행 카드 */
.trip{display:block;width:100%;text-align:left;border-radius:22px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.trip .em{font-size:30px;line-height:1}
.trip h3{margin:8px 0 2px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.trip .dt{font-size:13.5px;opacity:.8;margin-bottom:8px}
.trip .dd{position:absolute;top:14px;right:14px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.7)}
.trip .meta{font-size:12.5px;opacity:.75}
.c-ocean{background:linear-gradient(135deg,#DCEBF5,#C4DDF0)} .c-sunset{background:linear-gradient(135deg,#FCE3D2,#F8CDB8)}
.c-forest{background:linear-gradient(135deg,#DDEEDD,#C7E2CC)} .c-lavender{background:linear-gradient(135deg,#E7E1F5,#D6CCEF)}
.c-rose{background:linear-gradient(135deg,#F8DFE4,#F1C8D2)} .c-sand{background:linear-gradient(135deg,#F3EAD3,#E9DBB8)}
.c-night{background:linear-gradient(135deg,#2B3448,#1D2433);color:#fff} .c-night .tag,.c-night .dd{background:rgba(255,255,255,.15)}
.empty{text-align:center;color:var(--sub);padding:50px 10px}
.empty .big{font-size:44px}

/* 상세 */
.hero{border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .em{font-size:40px}
.hero h2{margin:6px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.hero .dt{font-size:14px;opacity:.85}
.hero .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.hero .acts button{padding:7px 12px;border-radius:11px;background:rgba(255,255,255,.65);font-size:13px;font-weight:700}
.c-night .acts button{background:rgba(255,255,255,.14)}
.hero .memo{margin-top:10px;font-size:13.5px;white-space:pre-wrap;opacity:.85}

.day{margin-bottom:18px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.day-h b{font-size:17px;font-weight:800}
.day-h span{color:var(--sub);font-size:13.5px}
.day-h .add{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
.stay{font-size:12.5px;color:var(--sub);margin:-4px 4px 8px}

.it{display:flex;gap:11px;background:var(--card);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;box-shadow:var(--sh);width:100%;text-align:left}
.it .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.it .bd{flex:1;min-width:0}
.it .tm{font-size:12px;font-weight:700;color:var(--sub)}
.it .tt{font-weight:700;font-size:15.5px;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.it .sm{font-size:13px;color:var(--sub);white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.it .lk{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.it .lk a{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--soft);text-decoration:none}
.it.ghost{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.it.ghost .tt{font-weight:600;color:var(--sub)}
.k-이동{background:#E3ECF8} .k-숙소{background:#EDE6F7} .k-식사{background:#FCE8DA} .k-갈곳{background:#DFF0E4}
.k-체험{background:#FFF1C9} .k-쇼핑{background:#F9E0E8} .k-기타{background:#ECEAE4}
.cost{font-size:12.5px;font-weight:700;color:var(--ink)}
.dist{font-size:12px;color:var(--sub);margin-left:4px}

.thumbs{display:flex;gap:6px;margin-top:9px}
.thumbs button{position:relative;width:60px;height:60px;border-radius:11px;overflow:hidden;background:var(--soft);flex:none}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .more{position:absolute;inset:0;background:rgba(20,24,33,.55);color:#fff;font-weight:800;display:grid;place-items:center}

.box{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);margin:18px 0}
.box h4{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.box h4 small{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:600}
.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .25s}
.pk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--soft)}
.pk:last-child{border-bottom:0}
.pk .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.pk.done .cb{background:var(--ok);border-color:var(--ok)}
.pk.done span{text-decoration:line-through;color:var(--sub)}
.pk span{flex:1;cursor:pointer}
.pk .x{color:var(--sub);padding:0 6px;font-size:15px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sug button{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--soft);font-weight:600}
.lnk{font-size:12.5px;font-weight:700;color:var(--sub);text-decoration:underline;margin-right:12px}

.stars button{font-size:26px;color:#D9D3C4;padding:0 2px}
.stars button.on{color:#F2B33D}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.gallery button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}

.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(var(--safe-b) + 20px);height:54px;padding:0 20px;border-radius:18px;
  background:var(--ink);color:#fff;font-weight:800;font-size:15px;box-shadow:0 10px 26px rgba(29,36,51,.32);z-index:20}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--sub);font-size:14.5px;margin:2px 0 12px}

/* 시트(모달) */
.scrim{position:fixed;inset:0;background:rgba(18,22,31,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:51;
  max-height:92vh;overflow-y:auto;padding:8px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{bottom:50%;border-radius:24px;transform:translateY(60%) scale(.98);opacity:0;transition:.2s}.sheet.on{transform:translateY(50%);opacity:1}}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px 12px;outline:none;font-size:16px}
.in:focus{border-color:var(--ink)}
textarea.in{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--sub);margin-top:4px;min-height:16px}
.hint.err{color:var(--warn)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.emojis button.on{border:2px solid var(--ink)}
.colors button{width:38px;height:38px;border-radius:12px;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:15px;font-weight:800;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.del{flex:none;color:var(--warn)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;font-size:13px;font-weight:700;color:var(--sub);text-align:center}
.ph.up::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55)}
.drop{outline:2px dashed var(--ink);outline-offset:4px;border-radius:14px}

/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(10,12,16,.94);z-index:80;display:none;align-items:center;justify-content:center;touch-action:pan-y}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:86vh;object-fit:contain}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.lb .p{left:10px} .lb .n{right:10px}
.lb .cl{position:absolute;top:calc(var(--safe-t) + 12px);right:14px;color:#fff;font-size:28px;width:44px;height:44px}
.lb .cnt{position:absolute;bottom:calc(var(--safe-b) + 16px);color:#fff;font-size:13px;opacity:.75}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translate(-50%,16px);background:var(--ink);color:#fff;
  padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.22s;z-index:99;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 로그인 */
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .logo{font-size:56px}
.login h1{font-size:26px;margin:8px 0 4px}
.login p{color:var(--sub);margin:0 0 22px}

/* 출력 */
.pv{position:fixed;inset:0;background:#E7E3DA;z-index:70;overflow:auto;display:none;padding:0 10px 40px}
.pv.on{display:block}
.pv-bar{position:sticky;top:0;margin:0 -10px 16px;padding:calc(var(--safe-t) + 10px) 12px 10px;background:#fff;display:flex;flex-direction:column;gap:8px;z-index:71;box-shadow:0 4px 18px rgba(29,36,51,.08)}
.pu-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pu-row .sp{flex:1}
.pu-lbl{font-size:12px;font-weight:800;color:var(--sub);margin:0 2px 0 4px}
.pu-info{font-size:12px;font-weight:700;color:var(--sub)}
.pu-info.warn{color:#E8590C}
.pb{height:36px;padding:0 13px;border-radius:11px;background:var(--soft);font-weight:800;font-size:13.5px}
.pb.pri{background:var(--ink);color:#fff}
.pu-chip{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:#ADB5BD}
.pu-chip.on{border-color:var(--c,#1D2433);color:var(--c,#1D2433)}
.seg.mini{display:inline-flex;padding:3px;margin:0;border-radius:11px}
.seg.mini button{flex:none;padding:5px 11px;font-size:13px;border-radius:8px}
.page{position:relative;width:794px;min-height:1123px;margin:0 auto 16px;background:#fff;padding:46px 50px;box-shadow:0 10px 40px rgba(29,36,51,.18);color:#1D2433;line-height:1.45}
#psLines{position:absolute;inset:0;pointer-events:none}
#psLines div{position:absolute;left:0;right:0;border-top:2px dashed #FA5252}
#psLines span{position:absolute;right:6px;top:2px;font-size:11px;font-weight:800;color:#FA5252}
.page .ph1{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1D2433;padding-bottom:12px;margin-bottom:14px}
.page .ph1 .em{font-size:2.2em}
.page .ph1 h1{margin:0;font-size:1.65em;letter-spacing:-.03em}
.page .ph1 div{font-size:.95em;color:#555}
.p-body.two{columns:2;column-gap:26px}
.page .pd{break-inside:avoid;margin-bottom:12px}
.page .pd h2{font-size:1.05em;margin:0 0 5px;padding:5px 10px;background:#F2EEE5;border-radius:7px;display:flex;gap:6px;align-items:baseline}
.page .pd h2 span{font-size:.8em;font-weight:900;color:#868E96}
.page .pd h2 em,.page .pd h2 small{margin-left:auto;font-style:normal;font-weight:600;font-size:.85em;color:#555}
.p-row{display:grid;grid-template-columns:3.6em 4.4em 1fr;gap:6px;padding:5px 4px;border-bottom:1px solid #EEE;break-inside:avoid;align-items:start}
.p-row.wide{grid-template-columns:8.4em 4.4em 1fr}
.p-time{color:#666;font-weight:700;font-size:.9em}
.p-cat{font-size:.8em;font-weight:800;border-radius:6px;padding:1px 5px;text-align:center;white-space:nowrap}
.p-t{font-weight:700}
.p-r{font-size:.85em;font-weight:700}
.p-m{font-size:.85em;color:#666}
.p-img{display:flex;gap:4px;margin-top:4px}
.p-img img{width:4.2em;height:4.2em;object-fit:cover;border-radius:5px}
.p-cost{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92em;padding:2px 4px}
.p-cost .tot{margin-left:auto}
.page .pk-p{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;font-size:.9em;padding:2px 4px}
.page .note{font-size:.9em;color:#444;white-space:pre-wrap;margin:4px 4px 8px}

/* 상세 — 기존 웹앱 스타일 */
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hstats div{background:rgba(255,255,255,.55);border-radius:13px;padding:8px 6px;text-align:center}
.hstats b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.hstats span{font-size:11.5px;opacity:.75}
.c-night .hstats div{background:rgba(255,255,255,.12)}
.hstats.home{grid-template-columns:repeat(4,1fr);margin:-4px 0 14px}
.hstats.home div{background:var(--card);box-shadow:var(--sh)}
.tag.st{background:var(--ink);color:#fff}
.daytabs{position:sticky;top:0;z-index:15;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:calc(var(--safe-t) + 8px) 16px 8px;background:var(--bg)}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{flex:none;padding:7px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;line-height:1.25;text-align:center}
.daytabs button small{display:block;font-size:11px;font-weight:600;color:var(--sub)}
.daytabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.daytabs button.on small{color:rgba(255,255,255,.7)}
.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 6px}
.day-h .dnum{font-size:11.5px;font-weight:900;letter-spacing:.06em;color:var(--sub)}
.day-h b{font-size:17px;font-weight:800}
.day-h .dcost{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
.day-sum{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.day-sum span{font-size:12.5px;font-weight:600;background:var(--card);border-radius:999px;padding:4px 10px;box-shadow:var(--sh)}
.tl{position:relative}
.tl-item{display:grid;grid-template-columns:44px 30px 1fr;gap:0 6px;cursor:pointer;position:relative}
.tl-item::before{content:"";position:absolute;left:64px;top:30px;bottom:-8px;border-left:2px solid var(--line)}
.tl-item:last-child::before{display:none}
.tl-time{font-size:12.5px;font-weight:800;color:var(--sub);text-align:right;padding-top:13px}
.tl-dot{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--c);display:grid;place-items:center;font-size:14px;margin-top:6px;z-index:1}
.tl-card{background:var(--card);border-radius:var(--r);padding:10px 13px;margin-bottom:8px;box-shadow:var(--sh);border-left:4px solid var(--c);min-width:0}
.tl-item.ghost .tl-card{background:transparent;box-shadow:none;border:1.5px dashed var(--line);border-left:4px solid var(--c)}
.tl-top{display:flex;align-items:center;gap:6px}
.tl-cat{font-size:11.5px;font-weight:800;color:var(--c)}
.tl-cost{margin-left:auto;font-size:12.5px;font-weight:800}
.tl-title{font-weight:700;font-size:15.5px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tl-card .sm{font-size:13px;color:var(--sub);white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.tl-card .lk{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tl-card .lk a{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--soft);text-decoration:none}
.tl-empty{color:var(--sub);font-size:13.5px;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);background:var(--card)}

/* 경비 정리 */
.cbar{border-bottom:1px solid var(--soft)}
.cbar summary{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 2px;cursor:pointer;list-style:none}
.cbar summary::-webkit-details-marker{display:none}
.cbar .cl{font-size:13.5px;font-weight:700}
.bar2{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--c);border-radius:9px}
.camt{font-size:13.5px;font-weight:800;white-space:nowrap}
.crow{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 12px;cursor:pointer;border-bottom:1px solid var(--soft)}
.crow:last-child{border-bottom:0}
.crow>div{flex:1;min-width:0}
.crow b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{font-size:12px;color:var(--sub)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.cbar[open] summary{border-bottom:1px solid var(--soft)}
.cbar .crow{background:var(--bg);border-radius:10px;margin:4px 0}
.clist{margin-top:4px}
.cday{margin-bottom:10px}
.cday-h{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--sub);padding:6px 4px;border-bottom:2px solid var(--soft)}
.cday-h b{color:var(--ink)}
.ctotal{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 4px 0;border-top:2px solid var(--ink);font-weight:800}
.ctotal b{font-size:18px}
.box .seg.mini{margin-bottom:10px}

@media print{
  body>*:not(.pv){display:none!important}
  .pv{position:static;display:block!important;padding:0;background:#fff;overflow:visible}
  .pv-bar,#psLines{display:none!important}
  .page{box-shadow:none;margin:0;zoom:1!important;min-height:0!important}
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
